<h1>Claims</h1>

<div class="sun-card">
  <mat-form-field class="sun-search">
    <input matInput [formControl]="searchControl" placeholder="Search by claim or policy number" sunAutofocus>
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <sun-loading-spinner [loading]="loading" message="Loading claims"></sun-loading-spinner>

  <table mat-table [dataSource]="dataSource" matSort *ngIf="!loading" class="mat-elevation-z1">

    <ng-container matColumnDef="claimNumber">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Claim</th>
      <td mat-cell *matCellDef="let claim">
        <a [routerLink]="['/claims', claim.claimNumber]">{{ claim.claimNumber }}</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="policyNumber">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Policy</th>
      <td mat-cell *matCellDef="let claim">{{ claim.policyNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="claimType">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let claim">{{ claim.incident.claimType }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let claim">{{ claim.status | claimStatus }}</td>
    </ng-container>

    <ng-container matColumnDef="lodgedAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Lodged</th>
      <td mat-cell *matCellDef="let claim">{{ claim.lodgedAt | date:'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let claim">
        <button mat-button color="primary" [routerLink]="['/claims', claim.claimNumber]">View</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
</div>
