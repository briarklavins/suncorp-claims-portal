<header class="sun-brand-header">

  <div class="sun-brand-header-start">
    <button mat-icon-button aria-label="Toggle navigation" (click)="toggleMenu()">
      <mat-icon>menu</mat-icon>
    </button>
    <img *ngIf="brand" class="sun-brand-logo" src="assets/brands/{{ brand.cssKey }}-logo.svg"
         alt="{{ brand.displayName }}">
    <span class="sun-brand-title">Claims lodgement</span>
  </div>

  <div class="sun-brand-header-end">
    <span class="sun-brand-phone" *ngIf="brand">Claims {{ brand.contactNumber }} &middot; {{ brand.claimsHours }}</span>
    <span class="sun-consultant" *ngIf="consultantName">{{ consultantName }}</span>
  </div>

</header>
